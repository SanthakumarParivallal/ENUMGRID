# Dependabot configuration for ENUMGRID.
#
# ENUMGRID is a security tool, so a stale transitive dependency is a finding in its
# own right. The CI gate already runs pip-audit, bandit and npm audit on every push;
# Dependabot is what keeps those gates from going red in the first place.
#
# Routine version updates are switched off: every ecosystem below sets
# `open-pull-requests-limit: 0`, which tells Dependabot not to raise scheduled
# version-bump pull requests. The repository is kept to a single branch, and
# dependency currency is handled by the maintainer running the audit gates.
#
# Security updates are deliberately left alone. GitHub raises those through a
# separate mechanism that this limit does not apply to, so a dependency with a
# published advisory still opens a pull request immediately. That is the one
# case where a second branch is wanted: it means pip-audit or npm audit is
# about to go red.
#
# The groups and schedules below are retained so version updates can be turned
# back on by restoring the limits (5 for pip and npm, 3 for actions and docker).
version: 2

updates:
  # Backend runtime dependencies (FastAPI, python-nmap, the CVE/NVD clients).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels: [dependencies, backend]
    commit-message:
      prefix: "deps(backend)"
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  # Root Python tooling: pyproject.toml and requirements-dev.txt
  # (pytest, ruff, bandit, pip-audit, coverage).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels: [dependencies, tooling]
    commit-message:
      prefix: "deps(python)"
    groups:
      dev-tooling-minor-and-patch:
        update-types: [minor, patch]

  # Cockpit UI: React, Vite, Tailwind, Vitest.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels: [dependencies, frontend]
    commit-message:
      prefix: "deps(frontend)"
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  # Pinned action SHAs and majors in .github/workflows/ci.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels: [dependencies, ci]
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-all:
        patterns: ["*"]

  # Base image in the root Dockerfile, which ships as a non-root container.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps(docker)"
